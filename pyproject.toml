[project]
name = "media-bot-v2"
version = "0.1.0"
description = "Telegram media download bot (YouTube, TikTok, Instagram, direct links) built on Telethon"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "GPL-3.0-or-later" }

dependencies = [
    # Telegram client (MTProto). Locked decision: Telethon, not Kurigram/Pyrogram/aiogram.
    "telethon>=1.36.0",
    # Download engines
    "yt-dlp[default,curl-cffi]>=2024.12.0",
    "yt-dlp-ejs>=0.1.0",
    "instaloader>=4.14",
    "gallery-dl>=1.27.0",
    # Database: same schema/DB as the old bot (MySQL in prod, SQLite for local dev/tests)
    "sqlalchemy>=2.0.36",
    "pymysql>=1.1.1",
    "cryptography>=43.0.3",
    # Config
    "pydantic-settings>=2.6.0",
    # Media probing/splitting (ffmpeg binary is a system requirement, not a pip package)
    "ffmpeg-python>=0.2.0",
    "filetype>=1.2.0",
    # Direct-link engine's streaming HTTP download
    "requests>=2.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["media_bot_v2"]
